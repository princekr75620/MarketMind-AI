
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMind AI - Revenue Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .ai-gradient-text {
            background: linear-gradient(90deg, #10b981, #34d399, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-shimmer {
            background: linear-gradient(
                to right,
                #ffffff 0%,
                #10b981 25%,
                #f43f5e 50%,
                #10b981 75%,
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
        .ai-glow {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }
        .ai-glow-red {
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.2);
        }
        
        /* 3D Effects */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .card-3d {
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease;
        }
        .card-3d:hover {
            transform: translateY(-12px) rotateX(4deg) rotateY(-2deg) scale(1.02);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.2);
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .gradient-border {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 1rem;
            z-index: 1;
        }
        .gradient-border::before {
            content: "";
            position: absolute;
            inset: -1px;
            background: linear-gradient(45deg, #10b981, transparent, #f43f5e);
            border-radius: 1rem;
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0.3;
        }
        .gradient-border:hover::before {
            opacity: 1;
        }
    </style>
